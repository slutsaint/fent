/* extra info: subjects, tasks, time per chapter */
let xi='',xs='all',xall=false;
const TCOL={theory:'#a8956a',module:'#6f8f7c',pyq:'#7d86a6',revision:'#a0705f'},SCOL={math:'#a8956a',chem:'#6f8f7c',phys:'#7d86a6'};
const fh=s=>{if(s<=0)return '0m';const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+'h '+pad(m)+'m':m+'m'};
function xiSet(v){xi=xi===v?'':v;xall=false;$('#xi').innerHTML=xiHTML(agg())}
function xiHTML(A){const tot=Object.values(A.bySubj).reduce((a,c)=>a+c,0);
  let h=`<div class="filt"><button class="b ${xi==='sub'?'go':''}" onclick="xiSet('sub')">Subjects &amp; tasks</button><button class="b ${xi==='chap'?'go':''}" onclick="xiSet('chap')">Time per chapter</button></div>`;
  if(!xi)return h+`<div class="mini">${fh(tot)} logged to chapters so far. Open one of the views above for the breakdown.</div>`;
  if(xi==='sub'){const R=42,C=2*Math.PI*R;let off=0,ring=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="#222" stroke-width="16"/>`;
    SUBJ.forEach(([s])=>{const len=tot?A.bySubj[s]/tot*C:0;if(len>0){ring+=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${SCOL[s]}" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=len}});
    const tmx=Math.max(1,...Object.values(A.byTask));
    return h+`<div class="xi2"><svg viewBox="0 0 120 120" width="150" role="img" aria-label="time by subject">${ring}<text x="60" y="58" text-anchor="middle" class="dn">${fh(tot)}</text><text x="60" y="72" text-anchor="middle" class="ds">logged</text></svg>
    <div class="xl">${SUBJ.map(([s,l])=>`<div class="pt"><i class="sw" style="background:${SCOL[s]}"></i><span style="flex:1">${l}</span><span>${fh(A.bySubj[s])}</span><span class="dim" style="width:38px;text-align:right">${tot?Math.round(A.bySubj[s]/tot*100):0}%</span></div>`).join('')}<br>
    ${TASKS.map(([k,l])=>`<div class="pt"><span style="width:70px">${l}</span><div class="bar"><b style="width:${A.byTask[k]/tmx*100}%;background:${TCOL[k]}"></b></div><span style="width:60px;text-align:right">${fh(A.byTask[k])}</span></div>`).join('')}</div></div>`}
  let list=Object.values(A.chap).filter(c=>(c.secs>0||c.q>0||tc(c.s,c.n)>0)&&(xs==='all'||c.s===xs));
  allChaps().forEach(c=>{if(!A.chap[c.s+'_'+c.n]&&tc(c.s,c.n)>0&&(xs==='all'||c.s===xs)&&!list.some(x=>x.s===c.s&&x.n===c.n))list.push({s:c.s,n:c.n,name:c.name,secs:0,q:0,by:{theory:0,module:0,pyq:0,revision:0},days:new Set()})});
  list.sort((a,c)=>c.secs-a.secs||c.q-a.q);const mx=Math.max(1,...list.map(c=>c.secs)),shown=xall?list:list.slice(0,10);
  h+=`<div class="filt">${[['all','All'],['math','Maths'],['chem','Chemistry'],['phys','Physics']].map(([k,l])=>`<label><input type="radio" name="xs" ${xs===k?'checked':''} onchange="xs='${k}';xall=false;$('#xi').innerHTML=xiHTML(agg())"> ${l}</label>`).join('')}</div>`;
  if(!list.length)return h+'<p class="dim">No chapter activity yet. Log time with a chapter and task chosen on the Focus page, or tick a task.</p>';
  h+=shown.map(c=>{const nm=(allChaps().find(x=>x.s===c.s&&x.n===c.n)||{}).name||c.name;return `<div class="cr"><div class="crn"><span style="color:${SCOL[c.s]}">&#9632;</span> ${nm}<small> ${c.days.size} day${c.days.size!==1?'s':''}${c.q?' · '+c.q+' questions':''}</small></div>
    <div class="crb" style="width:${c.secs/mx*100}%">${TASKS.map(([k])=>`<i style="width:${c.secs?c.by[k]/c.secs*100:0}%;background:${TCOL[k]}"></i>`).join('')}</div><div class="crt">${c.secs?fh(c.secs):'-'}</div></div>`}).join('');
  h+=`<div class="leg">${TASKS.map(([k,l])=>`<span><i style="background:${TCOL[k]}"></i>${l}</span>`).join('')}</div>`;
  if(list.length>10)h+=`<button class="b" onclick="xall=!xall;$('#xi').innerHTML=xiHTML(agg())">${xall?'Show top 10':'Show all '+list.length}</button>`;
  return h}
function dayInfo(k){const A=agg(),D=A.days[k]||{s:0,q:0},log=getLog(k),tl=J('fent_testlog_'+k,[]),dt=new Date(k+'T00:00:00');
  return `<h2>${DAYN[dt.getDay()]}, ${dt.getDate()} ${MONTHS[dt.getMonth()]}</h2><p>${Math.round(D.s*100)/100} sessions &middot; ${fm(dmins(D))} &middot; ${D.q||0} questions</p>`+log.map(e=>`<div class="pt"><span style="flex:1">${e.chapName} <small>${e.task}</small></span><span>${fm(e.durationSecs/60)}</span></div>`).join('')+tl.map(t=>`<div class="pt"><span style="flex:1">${t.testName} <small>test</small></span><span>${t.normalizedTotal}/${t.targetTotal}</span></div>`).join('')}
function hmPick(k){hmSel=k;renderStats()}
function hmNav(n){if(n===0){const d=new Date();hmY=d.getFullYear();hmM=d.getMonth()}else{hmM+=n;if(hmM<0){hmM=11;hmY--}if(hmM>11){hmM=0;hmY++}}hmSel=null;renderStats()}
function testStats(A){const t=A.tests;if(!t.length)return '<p class="dim">No tests yet. Use "Log a test" on the Focus page.</p>';
  const pts=t.map(x=>x.targetTotal?Math.max(0,x.normalizedTotal)/x.targetTotal*100:0),w=300,h=100,step=pts.length>1?w/(pts.length-1):0,xy=pts.map((p,i)=>[pts.length>1?i*step:w/2,h-p/100*h]);
  const avg=Math.round(t.reduce((a,x)=>a+x.normalizedTotal,0)/t.length),best=t.reduce((a,x)=>x.normalizedTotal/x.targetTotal>a.normalizedTotal/a.targetTotal?x:a);
  return `<div class="grid"><div class="box"><b>${t.length}</b>tests logged</div><div class="box"><b>${Math.round(pts.reduce((a,b)=>a+b,0)/pts.length)}%</b>average score</div><div class="box"><b>${best.normalizedTotal}/${best.targetTotal}</b>best</div></div>
  <svg class="sc" viewBox="0 -4 ${w} ${h+8}" preserveAspectRatio="none"><polyline points="${xy.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#ffb000" stroke-width="1.6" vector-effect="non-scaling-stroke"/>${xy.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.4" fill="#ffb000"/>`).join('')}</svg>
  <details><summary>All tests</summary>${t.slice().reverse().map(x=>`<div class="pt"><span style="flex:1">${x.testName} <small>${x.date} &middot; ${x.testType} &middot; ${fm(x.durationSecs/60)}${Object.entries(x.subjects||{}).map(([k,v])=>' &middot; '+k+' '+v.score+'/'+v.max).join('')}</small></span><span>${x.normalizedTotal}/${x.targetTotal}</span></div>`).join('')}</details>`}
/* ===== SETTINGS & BACKUP ===== */
function renderSet(){const f=[['sessionMins','Session length (min)'],['shortBreakMins','Short break (min)'],['longBreakMins','Long break (min)'],['sessionsPerCycle','Sessions before a long break'],['dailyTarget','Daily session target'],['dailyQuesTarget','Daily question target']];
  mount(`<h2>Focus settings</h2>${f.map(([k,l])=>`<div class="filt"><label style="width:260px">${l}</label><input type="number" min="1" id="s_${k}" value="${FS[k]}" style="width:80px"></div>`).join('')}<button class="b go" onclick="saveSet()">Save settings</button>
  <h2>Backup</h2><p class="dim">Copy the text below somewhere safe. To move to another browser, paste it in and restore.</p><button class="b" onclick="exp()">Show backup text</button> <button class="b" onclick="imp()">Restore from text</button><br><br><label class="dim">Or restore from a backup file (.json): <input type="file" accept=".json,application/json" onchange="impFile(this)" style="width:100%"></label><br><br><textarea id="bk" placeholder="backup text appears here"></textarea>`)}
function saveSet(){['sessionMins','shortBreakMins','longBreakMins','sessionsPerCycle','dailyTarget','dailyQuesTarget'].forEach(k=>{FS[k]=Math.max(1,parseInt($('#s_'+k).value)||FS[k])});
  const d=J('fent_focus',{})||{};d.settings=FS;putJ('fent_focus',d);if(!T.run&&T.mode){T.total=T.left=modeSecs(T.mode)}toast('Saved.')}
function exp(){const o={};for(let i=0;i<LS.length;i++){const k=LS.key(i);if(k&&k.startsWith('fent_'))o[k]=LS.getItem(k)}$('#bk').value=JSON.stringify(o);$('#bk').select();toast(Object.keys(o).length+' entries')}
function restoreText(txt){try{const o=JSON.parse(txt);if(!o||typeof o!=='object'||Array.isArray(o))throw 0;
    const ks=Object.keys(o).filter(k=>k.startsWith('fent_')&&k!==CK&&k!==IK);if(!ks.length)throw 0;
    if(!confirm('Restore '+ks.length+' entries? Anything with the same name in this tracker is replaced.'))return;
    ks.forEach(k=>{const v=o[k];LS.setItem(k,typeof v==='string'?v:JSON.stringify(v))});location.reload()}   /* accepts both string-style and plain-JSON backups */
  catch{toast('That is not a valid backup.')}}
function imp(){restoreText($('#bk').value)}
function impFile(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restoreText(String(r.result));r.onerror=()=>toast('Could not read that file.');r.readAsText(f);inp.value=''}
/* boot */
recover();ST=J('fent_v1',{});
put('fent_visits',F('fent_visits')+1);$('#foot').innerHTML='best viewed at 1024&times;768 &middot; visitor no. '+String(F('fent_visits')).padStart(6,'0');
counter();render();
</script></body></html>
