  --sand:var(--acc);
  color-scheme:dark}

/* ---- 2. BASE ---- */
*{box-sizing:border-box}
*,*::before,*::after{border-radius:0!important}
html{background:var(--bg)}
body{margin:0;padding:max(10px,env(safe-area-inset-top)) 10px calc(34px + env(safe-area-inset-bottom));
  background:var(--bg) var(--scan) repeat;color:var(--ink);font:14px/1.6 Verdana,Tahoma,Geneva,sans-serif}
::selection{background:var(--acc2);color:#fff}
.page{max-width:900px;margin:0 auto;background:var(--page);border:1px solid var(--hi);box-shadow:0 0 15px rgba(0,0,0,.9);padding:14px 18px 18px}
a,button.l{color:var(--ink);text-decoration:underline;cursor:pointer;background:none;border:0;font:inherit;padding:0}
button.l:hover,a:hover{color:var(--acc)}
small,.dim{color:var(--dim);font-size:12px}
p{margin:6px 0}
:focus-visible{outline:1px dotted var(--acc);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
*{scrollbar-color:var(--hi) var(--lo)}

/* ---- 3. HEADER: banner, avatar, title, day counter ---- */
.banner{position:relative;height:110px;margin:-14px -18px 12px;overflow:hidden;background:#000;border-bottom:1px solid var(--hi)}
.banner::before{content:'';position:absolute;inset:0;background:var(--banner) 38% 50%/cover no-repeat;image-rendering:auto;
  filter:saturate(.85) brightness(.8)}
.banner::after{content:'';position:absolute;inset:0;background:var(--scan) repeat}
.banner span{position:absolute;right:6px;bottom:3px;z-index:1;font:12px 'Courier New',monospace;color:var(--acc);text-shadow:1px 1px 0 #000}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.ttl{display:flex;gap:10px;align-items:flex-end}
.avatar{width:64px;height:64px;flex:none;border:1px solid var(--hi);background:var(--avatar) center/100% 100% no-repeat #121212;image-rendering:auto}
h1{font:italic 700 46px/1 Georgia,'Times New Roman',serif;margin:0;letter-spacing:-1px;color:#e0e0e0;text-shadow:1px 1px 0 #000}
h1 u{display:inline-block;width:.45em;height:3px;background:var(--acc2);margin-left:3px;text-decoration:none;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{visibility:hidden}}
.counter{text-align:center;font-size:10px;color:var(--dim)}
.lcd{display:inline-flex;gap:1px;margin-top:3px;border:1px solid var(--hi)}
.lcd i{background:#000;color:var(--acc);font:700 20px/1 'Courier New',monospace;padding:4px 5px;font-style:normal}

/* ---- 4. HEADINGS ---- */
h2{font:700 13.5px Verdana,Tahoma,sans-serif;text-transform:uppercase;letter-spacing:1px;margin:18px 0 8px;padding:3px 8px;
  background:#111;border:1px solid #333;border-left:4px solid var(--acc2);color:#d0d0d0}
h2 span{font-weight:400;color:var(--dim)}

/* ---- 5. NAV, TICKER, STATUS BAR ---- */
nav{margin:12px 0 0;padding:6px 0;border-top:1px dotted var(--rule);border-bottom:1px dotted var(--rule);display:flex;flex-wrap:wrap;gap:3px 4px}
nav button{padding:2px 9px;text-decoration:none;color:var(--ink);background:var(--lo);border:1px solid var(--hi);font-size:12px}
nav button:hover{color:#fff;background:#2a2a2a;border-color:#555}
nav button.on{color:var(--acc);border-color:var(--acc2);font-weight:700}
.mq{overflow:hidden;white-space:nowrap;border:1px solid var(--hi);background:var(--lo);color:var(--acc2);font:11px 'Courier New',monospace;padding:2px 0;margin:6px 0 4px}
.mq span{display:inline-block;padding-left:100%;animation:mq 45s steps(300) infinite;will-change:transform}
.mq:hover span{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-100%)}}
#sb{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:12px;padding:3px 10px calc(3px + env(safe-area-inset-bottom));
  background:#111;border-top:1px solid var(--hi);font-size:12px;color:var(--ink);z-index:9}
#sb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#sbr{color:var(--acc);flex:none;font-family:'Courier New',monospace}
.ldb{display:inline-block;width:60px;height:9px;border:1px solid var(--acc2);margin-left:8px;vertical-align:middle;
  background:repeating-linear-gradient(90deg,var(--acc2) 0 5px,transparent 5px 7px);clip-path:inset(0 100% 0 0);animation:ld .4s steps(8) forwards}
@keyframes ld{to{clip-path:inset(0 0 0 0)}}
footer{margin-top:16px;padding-top:6px;border-top:1px dotted var(--rule);text-align:center;font-size:10px;color:var(--dim)}

/* ---- 6. FORM CONTROLS ---- */
input,select,button.b,textarea{font:13.5px Verdana,Tahoma,sans-serif;color:var(--ink);background:var(--lo);border:1px solid var(--hi);padding:3px 6px;max-width:100%}
input:hover,select:hover,textarea:hover{border-color:#555}
input:focus,select:focus,textarea:focus{border-color:var(--acc2)}
button.b{cursor:pointer;padding:4px 14px;min-width:64px}
button.b:hover{background:#2a2a2a;color:#fff;border-color:#555}
button.b:active{background:#000;border-color:var(--acc2)}
button.b.go{background:var(--acc2);color:#fff;border-color:var(--acc2);font-weight:700}
button.b.go:hover{background:var(--acc);color:#000;border-color:var(--acc)}
button.b:disabled{opacity:.4;cursor:default}
input[type=checkbox],input[type=radio]{appearance:none;-webkit-appearance:none;width:13px;height:13px;border:1px solid #555;background:var(--lo);margin:0;display:inline-grid;place-content:center;cursor:pointer;flex:none}
input[type=checkbox]:hover,input[type=radio]:hover{border-color:var(--acc)}
input[type=checkbox]:checked{border-color:var(--acc2)}
input[type=checkbox]:checked::after{content:'';width:3px;height:7px;border:solid var(--acc);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
input[type=radio]:checked{border-color:var(--acc2)}
input[type=radio]:checked::after{content:'';width:5px;height:5px;background:var(--acc)}
input[type=number]{-moz-appearance:textfield;appearance:textfield}input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
textarea{width:100%;height:90px;font:11px 'Courier New',monospace}
.filt{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}.filt label{display:flex;gap:6px;align-items:center;cursor:pointer}
.ctl{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.msg{min-height:1.4em;margin-top:4px;font-size:12.5px}.msg.ok{color:var(--acc)}.msg.bad{color:#b57a78}
details{margin:10px 0}
summary{cursor:pointer;color:var(--dim)}
summary:hover{color:var(--acc)}
table.tf{border-collapse:separate;border-spacing:4px 5px;margin:6px 0}.tf th{font-weight:400;color:var(--dim);font-size:12px;text-align:left}.tf td:first-child{padding-right:14px}.tf input{width:96px}
.fg{display:grid;grid-template-columns:80px 70px 70px;gap:6px;align-items:center;margin:6px 0;font-size:11px}.fg input{width:70px}

/* ---- 7. CHAPTER ROWS (Home + Syllabus) ---- */
.row{display:grid;grid-template-columns:2ch 1fr auto;gap:2px 10px;align-items:baseline;padding:7px 4px;border-bottom:1px dotted var(--rule)}
.row:hover{background:var(--win)}
.row.d .nm{text-decoration:line-through;color:var(--dim)}
.row .why{grid-column:2/4;font-size:11.5px;line-height:1.4}
.row .tk{grid-column:2/4;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px}
.tk label{cursor:pointer;display:flex;gap:5px;align-items:center}
.bar{height:12px;border:1px solid var(--hi);background:var(--lo);padding:1px}
.bar b{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--acc2) 0 7px,transparent 7px 9px)}
.pt{display:flex;gap:8px;align-items:center;margin:3px 0;padding-bottom:2px;border-bottom:1px dotted var(--rule)}.pt .bar{flex:1}

/* ---- 7b. WEEK PLANNER (Home): hidden add window + stacked day list with draggable rows ---- */
.filt .wbtn{margin-left:auto}
.wadd{display:none;margin:2px 0 8px;padding:8px;border:1px solid var(--hi);border-left:4px solid var(--acc2);background:var(--win)}

/* ===== WEEK PLANNER (Home) =====

   A row's tick IS the syllabus tick (same tick() call), so progress everywhere stays in sync.
   Syllabus due date = the latest day a chapter is planned on; done date = when its theory + PYQ were ticked (ts_ keys written by tick()).

const chapOf=(s,n)=>allChaps().find(c=>c.s===s&&c.n===n);

const dshort=k=>{const[y,m,d]=k.split('-').map(Number);return d+' '+MONTHS[m-1]+(y!==new Date().getFullYear()?' '+y:'')};

function doneKey(s,n){let m='';MAIN.forEach(k=>{const v=ST['ts_'+s+'_'+n+'_'+k];if(isKey(v)&&v>m)m=v});return m}
function dueHTML(s,n){if(mainDone(s,n)){const k=doneKey(s,n);return '<span class="dd">done'+(k?' '+dshort(k):'')+'</span> · '}
  const k=dueKey(s,n);return k?'<span class="'+(k<dk()?'late':'')+'">due '+dshort(k)+'</span> · ':''}
const od=t=>{const d=pd(t);return d.getDate()+' '+MONTHS[d.getMonth()]};
function histItems(){const keys=weekDays().map(dk),out=[];allChaps().forEach(c=>{const e=pd(c.e);if(isNaN(e))return;const k=dk(e);if(keys.includes(k))out.push({c,k})});return out}
function oldTag(c){const on=mainDone(c.s,c.n),k=on?doneKey(c.s,c.n):'';

function oldHTML(c){const on=mainDone(c.s,c.n);

function planToggle(){PLO=!PLO;const w=$('#wadd'),b=$('#pa-btn');if(w)w.classList.toggle('open',PLO);if(b)b.textContent=PLO?'- Close':'+ Add to plan'}

function planItems(){const keys=weekDays().map(dk);return PL.filter(x=>keys.includes(x.d)&&chapOf(x.s,x.n))}

function planSync(){const box=$('#pl');if(!box)return;const by={};PL.forEach(x=>by[x.id]=x);let t=0,d=0;

  box.querySelectorAll('.wd').forEach(w=>{const cs=[...w.querySelectorAll('.wc')],dn=cs.filter(c=>c.classList.contains('d')).length;w.querySelector('em').textContent=cs.length?dn+'/'+cs.length:'';w.classList.toggle('em',!cs.length);t+=cs.length;d+=dn});
  const p=$('#pl-prog'),b=$('#pl-bar');if(p)p.textContent=t?(d===t?'all '+t+' done ***':d+' of '+t+' done'):'nothing planned yet';if(b)b.style.width=(t?Math.round(d/t*100):0)+'%'}
function planAdd(){const m=$('#pa-msg'),say=(t,c)=>{m.textContent=t;m.className='msg '+c};

function planKey(e){const c=e.target;if(!c.classList||!c.classList.contains('wc')||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();

/* mouse/touch drag: pick a row up, a dashed slot shows where it will land, drop to place it */
function planDown(e){if(e.button>0||PLD)return;const card=e.target.closest&&e.target.closest('.wc');if(!card||card.classList.contains('hs')||e.target.closest('input,button,label'))return;

  <svg class="sc" viewBox="0 -4 ${w} ${h+8}" preserveAspectRatio="none"><polyline points="${xy.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#9ca5c6" stroke-width="1.6" vector-effect="non-scaling-stroke"/>${xy.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.4" fill="#9ca5c6"/>`).join('')}</svg>
  <details><summary>All tests</summary>${t.slice().reverse().map(x=>`<div class="pt"><span style="flex:1">${x.testName} <small>${x.date} &middot; ${x.testType} &middot; ${fm(x.durationSecs/60)}${Object.entries(x.subjects||{}).map(([k,v])=>' &middot; '+k+' '+v.score+'/'+v.max).join('')}</small></span><span>${x.normalizedTotal}/${x.targetTotal}</span></div>`).join('')}</details>`}
/* ===== SETTINGS & BACKUP ===== */
function renderSet(){const f=[['sessionMins','Session length (min)'],['shortBreakMins','Short break (min)'],['longBreakMins','Long break (min)'],['sessionsPerCycle','Sessions before a long break'],['dailyTarget','Daily session target'],['dailyQuesTarget','Daily question target']];
  mount(`<h2>Focus settings</h2>${f.map(([k,l])=>`<div class="filt"><label style="width:260px">${l}</label><input type="number" min="1" id="s_${k}" value="${FS[k]}" style="width:80px"></div>`).join('')}<button class="b go" onclick="saveSet()">Save settings</button>
  <h2>Backup</h2><p class="dim">Copy the text below somewhere safe. To move to another browser, paste it in and restore.</p><button class="b" onclick="exp()">Show backup text</button> <button class="b" onclick="imp()">Restore from text</button><br><br><label class="dim">Or restore from a backup file (.json): <input type="file" accept=".json,application/json" onchange="impFile(this)" style="width:100%"></label><br><br><textarea id="bk" placeholder="backup text appears here"></textarea>`)}
function saveSet(){['sessionMins','shortBreakMins','longBreakMins','sessionsPerCycle','dailyTarget','dailyQuesTarget'].forEach(k=>{FS[k]=Math.max(1,parseInt($('#s_'+k).value)||FS[k])});
  const d=J('fent_focus',{})||{};d.settings=FS;putJ('fent_focus',d);if(!T.run&&T.mode){T.total=T.left=modeSecs(T.mode)}toast('Saved.')}
function exp(){const o={};for(let i=0;i<LS.length;i++){const k=LS.key(i);if(k&&k.startsWith('fent_'))o[k]=LS.getItem(k)}$('#bk').value=JSON.stringify(o);$('#bk').select();toast(Object.keys(o).length+' entries')}
function restoreText(txt){try{const o=JSON.parse(txt);if(!o||typeof o!=='object'||Array.isArray(o))throw 0;
    const ks=Object.keys(o).filter(k=>k.startsWith('fent_')&&k!==CK&&k!==IK);if(!ks.length)throw 0;
    if(!confirm('Restore '+ks.length+' entries? Anything with the same name in this tracker is replaced.'))return;
    ks.forEach(k=>{const v=o[k];LS.setItem(k,typeof v==='string'?v:JSON.stringify(v))});location.reload()}   /* accepts both string-style and plain-JSON backups */
  catch{toast('That is not a valid backup.')}}
function imp(){restoreText($('#bk').value)}
function impFile(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restoreText(String(r.result));r.onerror=()=>toast('Could not read that file.');r.readAsText(f);inp.value=''}
/* boot */
recover();ST=J('fent_v1',{});
put('fent_visits',F('fent_visits')+1);$('#foot').innerHTML='best viewed at 1024&times;768 &middot; visitor no. '+String(F('fent_visits')).padStart(6,'0');
counter();render();
</script></body></html>
